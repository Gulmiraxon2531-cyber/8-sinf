<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>8-sinf Fizika</title>
<style>
:root{
  --bg:#0b1220;
  --bg2:#111827;
  --c:#151f2e;
  --c2:#1a2538;
  --t:#e8eef7;
  --t2:#94a3b8;
  --a:#38bdf8;
  --a2:#0ea5e9;
  --b:#1e293b;
  --ok:#22c55e;
  --no:#ef4444;
  --glow:0 0 20px rgba(56,189,248,.25);
  --radius:14px;
}
@media(prefers-color-scheme:light){
  :root{
    --bg:#f0f7ff;--bg2:#e0f2fe;--c:#ffffff;--c2:#f8fafc;
    --t:#0f172a;--t2:#475569;--a:#0284c7;--a2:#0369a1;
    --b:#cbd5e1;--glow:0 4px 20px rgba(2,132,199,.12);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--t);
  line-height:1.65;
  min-height:100vh;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -20%,rgba(56,189,248,.15),transparent),
    radial-gradient(circle at 100% 100%,rgba(14,165,233,.08),transparent 40%);
}
header{
  background:linear-gradient(135deg,#0c4a6e 0%,#0369a1 50%,#0ea5e9 100%);
  color:#fff;
  padding:20px 16px 18px;
  text-align:center;
  position:relative;
  overflow:hidden;
  box-shadow:0 4px 30px rgba(14,165,233,.3);
}
header::before{
  content:'';
  position:absolute;inset:0;
  background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.06'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  opacity:.5;
}
header h1{
  margin:0;font-size:28px;font-weight:800;letter-spacing:-.5px;
  position:relative;cursor:pointer;text-shadow:0 2px 10px rgba(0,0,0,.2);
}
header h1:hover{opacity:.9}
header p{margin:8px 0 0;opacity:.92;font-size:14px;position:relative}
.au{
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.2);
  border-radius:12px;
  padding:12px 14px;
  margin:14px auto 0;
  max-width:380px;
  font-size:13.5px;
  position:relative;
}
.au b{color:#e0f2fe}
.mb{
  background:#fff;color:#0369a1;font-weight:700;
  border:0;border-radius:10px;padding:10px 18px;margin-top:12px;
  font-size:15px;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.15);
  position:relative;transition:transform .15s,box-shadow .15s;
}
.mb:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.2)}
main{max-width:880px;margin:0 auto;padding:16px 14px 40px}
.card{
  background:var(--c);
  border:1px solid var(--b);
  border-radius:var(--radius);
  padding:16px 18px;
  margin:14px 0;
  box-shadow:var(--glow);
}
.card h2{font-size:20px;margin:0 0 10px;color:var(--a);font-weight:700}
.card h3{font-size:17px;margin:18px 0 8px;color:var(--a2);font-weight:600}
.card p,.card li{color:var(--t);font-size:15px}
.card ul,.card ol{padding-left:20px;margin:8px 0}
.card li{margin:4px 0}
.toc{padding:4px 2px}
.toc-title{
  display:flex;align-items:center;gap:10px;
  font-size:18px;font-weight:800;color:var(--a);
  padding:12px 14px 16px;border-bottom:1px solid var(--b);
  margin-bottom:8px;
}
.toc-title span{font-size:22px}
.toc a,.toc div{
  display:block;padding:10px 12px 10px 14px;
  color:var(--t);text-decoration:none;cursor:pointer;
  transition:background .15s,color .15s,transform .1s;
  border-radius:10px;margin:2px 0;font-size:14px;
  border-left:3px solid transparent;
}
.toc a:hover{
  background:rgba(56,189,248,.12);color:var(--a);
  border-left-color:var(--a);transform:translateX(3px);
}
.toc .ch{
  font-weight:700;border:0;padding:14px 12px 8px;
  font-size:13.5px;letter-spacing:.4px;margin-top:10px;
  display:flex;align-items:center;gap:8px;
  background:linear-gradient(90deg,rgba(56,189,248,.15),transparent);
  border-radius:10px;border-left:3px solid var(--a);
}
.toc .ch-icon{font-size:18px;line-height:1}
.toc .ex{
  background:linear-gradient(135deg,rgba(56,189,248,.18),rgba(14,165,233,.1));
  border:1px solid rgba(56,189,248,.3);
  border-radius:12px;margin:8px 4px;font-weight:600;
  padding:12px 14px;display:flex;align-items:center;gap:8px;
  border-left:3px solid var(--a);
}
.toc .ex:hover{background:rgba(56,189,248,.25);transform:translateX(2px)}
.toc .num{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:22px;height:22px;border-radius:6px;
  background:rgba(56,189,248,.15);color:var(--a);
  font-size:12px;font-weight:700;margin-right:6px;
}
button{
  background:linear-gradient(135deg,var(--a2),var(--a));
  color:#fff;border:0;border-radius:10px;
  padding:10px 16px;margin:4px;font-size:14.5px;cursor:pointer;
  font-weight:600;transition:transform .15s,box-shadow .15s;
  box-shadow:0 2px 10px rgba(14,165,233,.3);
}
button:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(14,165,233,.4)}
button:active{transform:translateY(0)}
button.o{
  background:var(--c2);color:var(--t);
  border:1px solid var(--b);display:block;width:100%;
  text-align:left;box-shadow:none;margin:6px 0;
}
button.o:hover{border-color:var(--a);background:rgba(56,189,248,.08)}
button.o.ok{border-color:var(--ok);background:rgba(34,197,94,.12);color:var(--ok)}
button.o.no{border-color:var(--no);background:rgba(239,68,68,.12);color:var(--no)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.tabs button{
  background:var(--c2);color:var(--t2);border:1px solid var(--b);
  box-shadow:none;font-weight:500;padding:8px 14px;
}
.tabs .on{
  background:linear-gradient(135deg,var(--a2),var(--a));
  color:#fff;border-color:transparent;
  box-shadow:0 2px 10px rgba(14,165,233,.3);
}
.sim{
  width:100%;height:300px;border-radius:12px;
  background:#060d18;
  border:1px solid #1e3a5f;
  box-shadow:inset 0 0 40px rgba(14,165,233,.08);
}
input[type=range]{
  width:100%;height:6px;border-radius:3px;
  background:var(--b);outline:none;-webkit-appearance:none;margin:8px 0;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:var(--a);cursor:pointer;box-shadow:0 0 8px rgba(56,189,248,.5);
}
#field{
  position:relative;height:280px;
  background:linear-gradient(180deg,#060d18,#0b1220);
  border-radius:12px;overflow:hidden;
  border:1px solid #1e3a5f;
}
.dot{
  position:absolute;width:36px;height:36px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,#7dd3fc,#0ea5e9 60%,#0369a1);
  cursor:pointer;box-shadow:0 0 12px rgba(56,189,248,.6);
  transition:transform .1s;
}
.dot:active{transform:scale(1.15)}
iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px}
.ok{color:var(--ok);font-weight:700}
.no{color:var(--no);font-weight:700}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9;backdrop-filter:blur(2px)}
#drawer{
  position:fixed;top:0;bottom:0;left:0;
  width:min(88vw,360px);
  background:var(--c);
  z-index:10;overflow:auto;
  transform:translateX(-100%);transition:.28s cubic-bezier(.4,0,.2,1);
  padding:12px 10px calc(16px + env(safe-area-inset-bottom,0px));
  border-right:1px solid var(--b);
  box-shadow:8px 0 30px rgba(0,0,0,.3);
}
#drawer::before{
  content:'';
  position:absolute;top:0;left:0;right:0;height:120px;
  background:linear-gradient(180deg,rgba(56,189,248,.12),transparent);
  pointer-events:none;z-index:0;
}
.toc{position:relative;z-index:1}

body.d #drawer{transform:none}
body.d #ov{display:block}
#cap{
  background:rgba(6,13,24,.85)!important;
  backdrop-filter:blur(6px);
  border-top:1px solid rgba(56,189,248,.2);
}
#bar{background:linear-gradient(90deg,var(--a2),var(--a))!important;border-radius:3px}
small{color:var(--t2);font-size:13px}
b{color:var(--a)}
code{background:var(--c2);padding:2px 6px;border-radius:4px;font-size:13px}
</style></head><body>

theory:`<h3>1. Elektrlanish hodisasi</h3><p>Qadimgi yunonlar mox (yantar — „elektron“ soʻzi) mayin matoga ishqalansa, yengil jismlarni oʻziga tortishini payqaganlar. Jismning boshqa jismlarni oʻziga tortish xossasini olishi <b>elektrlanish</b>, bunday jism esa <b>zaryadlangan jism</b> deyiladi.</p>
<h3>2. Ikki xil zaryad</h3><ul><li><b>Musbat (+)</b> zaryad — ipakka ishqalangan shisha tayoqchada hosil boʻladi.</li><li><b>Manfiy (−)</b> zaryad — junga (moʻynaga) ishqalangan ebonit tayoqchada hosil boʻladi.</li></ul>
<p>Bu shartli belgilashlarni amerikalik olim <b>B. Franklin</b> kiritgan. Tabiatda faqat ikki xil zaryad mavjud.</p>
<h3>3. Zaryadlarning oʻzaro taʼsiri</h3><p><b>Bir xil</b> ishorali zaryadlangan jismlar <b>bir-birini itaradi</b>, <b>har xil</b> ishorali zaryadlangan jismlar esa <b>bir-birini tortadi</b>.</p>
<h3>4. Atom tuzilishi</h3><p>Atom <b>yadro</b> va uning atrofida harakatlanuvchi <b>elektronlardan</b> iborat. Yadro musbat zaryadli <b>protonlar</b> va zaryadsiz <b>neytronlardan</b> tuzilgan. Elektron manfiy zaryadli. Odatda atomda protonlar va elektronlar soni teng, shuning uchun jism <b>neytral</b> (zaryadsiz) boʻladi.</p>
<h3>5. Elektrlanishning sababi</h3><p>Ishqalanishda elektronlar bir jismdan ikkinchisiga oʻtadi. Elektron yoʻqotgan jism musbat, elektron orttirgan jism manfiy zaryadlanadi. Protonlar yadroda mahkam bogʻlangan, shu sababli ular koʻchmaydi.</p>
<h3>6. Elektrlanish usullari</h3><ul><li><b>Ishqalash</b> orqali.</li><li><b>Tegizish</b> (zaryadlangan jism bilan tekkizish) orqali.</li><li><b>Taʼsir (influensiya)</b> orqali — jism tegmasdan yaqinlashtirilganda.</li></ul>
<h3>7. Elektroskop</h3><p><b>Elektroskop</b> — jismning zaryadlanganini aniqlaydigan asbob. Zaryadlangan jism sterjenga tekkizilsa, bir xil ishorali zaryad olgan varaqchalar bir-birini itarib ajraladi. Zaryad qancha katta boʻlsa, ular shuncha koʻproq ajraladi.</p>
<h3>8. Zaryadning saqlanish qonuni</h3><p>Yakkalangan sistemada zaryadlarning algebraik yigʻindisi oʻzgarmaydi: zaryad yoʻqdan paydo boʻlmaydi va yoʻqolib ketmaydi, faqat bir jismdan ikkinchisiga oʻtadi.</p>
<h3>9. Hayotda</h3><ul><li>Quruq sochga taroq tekkizilsa, soch tarqoq tikka turadi.</li><li>Sintetik kiyim yechilganda chirsillaydi.</li><li>Chang ekran va televizorga yopishadi.</li><li>Chaqmoq — bulutlarning elektrlanishi natijasi.</li></ul>
<h3>📌 Eslab qoling</h3><ul><li>Ikki xil zaryad bor: musbat va manfiy.</li><li>Bir xil zaryadlar itaradi, har xillari tortadi.</li><li>Zaryadlanishda elektronlar koʻchadi.</li><li>Elektroskop zaryadni aniqlaydi.</li></ul>

theory:`<h3>1. Elektr zaryad nima?</h3><p><b>Elektr zaryad</b> — jismlarning elektromagnit taʼsirlashishga qodirligini xarakterlovchi fizik kattalik. U <b>q</b> harfi bilan belgilanadi. Zaryadlangan jism atrofida <b>elektr maydon</b> hosil boʻladi va u boshqa zaryadlarga taʼsir qiladi.</p>
<h3>2. Zaryad birligi</h3><p>Xalqaro birliklar sistemasida zaryad <b>kulon</b> (C) bilan oʻlchanadi — fransuz fizigi Sh. Kulon sharafiga. 1 C — 1 s davomida 1 A tok oʻtganda oʻtkazgich kesimidan oʻtadigan zaryad: <b>1 C = 1 A·s</b>. Amalda kichik birliklar ishlatiladi:</p>
<ul><li>1 mC (millikulon) = 10⁻³ C</li><li>1 µC (mikrokulon) = 10⁻⁶ C</li><li>1 nC (nanokulon) = 10⁻⁹ C</li></ul>
<h3>3. Elementar zaryad</h3><p>Eng kichik zaryad — <b>elementar zaryad</b> <b>e = 1,6·10⁻¹⁹ C</b>. Elektron zaryadi −e, proton zaryadi +e. Elektron massasi m<sub>e</sub> ≈ 9,1·10⁻³¹ kg, proton massasi m<sub>p</sub> ≈ 1,67·10⁻²⁷ kg (elektrondan taxminan 1836 marta ogʻir).</p>
<h3>4. Zaryadning diskretligi</h3><p>Har qanday jism zaryadi elementar zaryadning butun karrali: <b>q = ±n·e</b>, bu yerda n — butun son (ortiqcha yoki yetishmaydigan elektronlar soni). Masalan, 1 C zaryad uchun taxminan 6,25·10¹⁸ ta elektron kerak. Zaryadni e dan kichik qismlarga boʻlib boʻlmaydi.</p>
<h3>5. Zaryadning saqlanish qonuni</h3><p>Yakkalangan (tashqi taʼsirsiz) sistemadagi zaryadlarning algebraik yigʻindisi doimiy: <b>q₁ + q₂ + … = const</b>. Ikkita bir xil metall shar tekkizilganda, ular zaryadi oʻzaro teng taqsimlanadi: <b>q' = (q₁ + q₂)/2</b>.</p>
<p><i>Misol:</i> shar zaryadlari +6 nC va −2 nC. Tekkizilgandan soʻng har biri (6 − 2)/2 = +2 nC boʻladi.</p>
<h3>6. Oʻtkazgich, dielektrik, yarimoʻtkazgich</h3><ul><li><b>Oʻtkazgichlar</b> (metallar, shoʻr suv, grafit) — erkin zaryadlari bor, zaryad ularda erkin koʻchadi.</li><li><b>Dielektriklar</b> (shisha, ebonit, kauchuk, quruq havo) — erkin zaryadlari deyarli yoʻq.</li><li><b>Yarimoʻtkazgichlar</b> (kremniy, germaniy) — oraliq xossali, harorat va yoritilganlikka bogʻliq.</li></ul>
<h3>7. Zaryadni oʻlchash</h3><p>Zaryad elektrometr yordamida oʻlchanadi. Elektroskop esa faqat zaryad borligini va taxminiy kattaligini koʻrsatadi.</p>
<h3>8. Masala namunasi</h3><p>Jismda 5·10¹² ta ortiqcha elektron bor. Zaryadi: q = n·e = 5·10¹²·1,6·10⁻¹⁹ = 8·10⁻⁷ C = 0,8 µC (manfiy).</p>
<h3>📌 Eslab qoling</h3><ul><li>q = n·e, e = 1,6·10⁻¹⁹ C.</li><li>Zaryad birligi — kulon (C).</li><li>Zaryadlar yigʻindisi saqlanadi.</li><li>Bir xil sharlar tekkizilsa zaryad teng boʻlinadi.</li></ul>
<h3>❓ Savollar</h3><ol><li>Elektr zaryad nima va u qanday birlikda oʻlchanadi?</li><li>Elementar zaryad nima? Qiymati qancha?</li><li>Zaryadning saqlanish qonunini ayting.</li><li>Oʻtkazgich va dielektrikning farqi nimada?</li><li>3 nC va −9 nC li bir xil sharlar tekkizilsa, zaryadi qancha boʻladi?</li></ol>`,

theory:`<h3>1. Nuqtaviy zaryad</h3><p>Oʻlchamlari ular orasidagi masofaga nisbatan juda kichik boʻlgan zaryadlangan jism <b>nuqtaviy zaryad</b> deyiladi. Bu — fizik model (moddiy nuqta kabi).</p>
<h3>2. Kulon tajribasi</h3><p>1785-yilda fransuz olimi <b>Sharl Kulon</b> buralma tarozi yordamida zaryadlar taʼsir kuchini oʻlchadi. U kuchning zaryadlar koʻpaytmasiga va masofaga bogʻliqligini aniqladi.</p>
<h3>3. Kulon qonuni</h3><p>Vakuumda ikki nuqtaviy zaryad orasidagi oʻzaro taʼsir kuchi zaryadlar modullarining koʻpaytmasiga toʻgʻri proporsional va ular orasidagi masofaning kvadratiga teskari proporsional:</p>
<p style="font-size:20px;text-align:center"><b>F = k·|q₁|·|q₂| / r²</b></p>
<ul><li>k = 9·10⁹ N·m²/C² — proporsionallik koeffitsiyenti;</li><li>q₁, q₂ — zaryadlar (C);</li><li>r — ular orasidagi masofa (m);</li><li>F — kuch (N).</li></ul>
<h3>4. Kuchning yoʻnalishi</h3><p>Kuch zaryadlarni tutashtiruvchi chiziq boʻylab yoʻnaladi. Bir xil ishorali zaryadlar uchun — itarish, har xil ishorali zaryadlar uchun — tortishish. Ikkala zaryadga kuchlar son jihatdan teng, yoʻnalishi qarama-qarshi (Nyutonning 3-qonuni).</p>
<h3>5. Dielektrik muhitda</h3><p>Muhitda kuch <b>ε</b> marta kamayadi: <b>F = k·|q₁|·|q₂| / (ε·r²)</b>. ε — muhitning dielektrik singdiruvchanligi: vakuum — 1, havo ≈ 1, kerosin ≈ 2, moy ≈ 2,5, shisha ≈ 6–7, suv ≈ 81. Suvda ionli birikmalar oson eriydi, chunki ion-ion kuchi 81 marta kamayadi.</p>
<h3>6. Butun olam tortishish qonuni bilan oʻxshashlik</h3><p>Tortishish kuchi ham F = G·m₁m₂/r² koʻrinishiga ega. Farqi: tortishish doim tortadi, Kulon kuchi esa tortishi ham, itarishi ham mumkin; elektr kuch gravitatsiyadan ham juda ulkan.</p>
<h3>7. Masala namunasi</h3><p>Vakuumda 2 nC va 4 nC zaryadlar 2 sm masofada. F = 9·10⁹·2·10⁻⁹·4·10⁻⁹ / (0,02)² = 7,2·10⁻⁸ / 4·10⁻⁴ = 1,8·10⁻⁴ N. Masofa 2 marta ortsa — kuch 4 marta kamayadi: 4,5·10⁻⁵ N.</p>
<h3>📌 Eslab qoling</h3><ul><li>F = k·q₁q₂/r², k = 9·10⁹ N·m²/C².</li><li>Muhitda F ε marta kamayadi.</li><li>Kuch tutashtiruvchi chiziq boʻylab yoʻnaladi.</li></ul>
<h3>❓ Savollar</h3><ol><li>Kulon qonunini ta'riflang va formulasini yozing.</li><li>k ning fizik ma'nosi nima?</li><li>Masofa 3 marta ortsa kuch qanday oʻzgaradi?</li><li>Suvda kuch nega kamayadi?</li></ol>`,

theory:`<h3>1. Kerakli formulalar</h3><ul><li>Kulon qonuni: <b>F = k·|q₁|·|q₂| / (ε·r²)</b>, k = 9·10⁹ N·m²/C².</li><li>Zaryad kvantlanishi: <b>q = n·e</b>, e = 1,6·10⁻¹⁹ C.</li><li>Sharlar tekkizilganda: <b>q' = (q₁ + q₂)/2</b> (bir xil sharlar).</li></ul>
<h3>2. Birliklarni oʻtkazish</h3><ul><li>1 nC = 10⁻⁹ C, 1 µC = 10⁻⁶ C, 1 mC = 10⁻³ C.</li><li>1 sm = 10⁻² m, 1 mm = 10⁻³ m.</li><li>1 mN = 10⁻³ N, 1 µN = 10⁻⁶ N.</li></ul>

theory:`<h3>1. Elektr maydon</h3><p>Zaryadlar bir-biriga masofadan, <b>elektr maydon</b> orqali taʼsir qiladi. Elektr maydon — zaryad atrofida mavjud boʻlgan, boshqa zaryadlarga kuch bilan taʼsir qiluvchi materiyaning alohida koʻrinishi. U sezgilarimiz bilan seziladi emas, faqat taʼsiri orqali bilinadi. Qoʻzgʻalmas zaryadlarning maydoni <b>elektrostatik maydon</b> deyiladi.</p>
<h3>2. Maydon kuchlanganligi</h3><p>Maydonning berilgan nuqtadagi kuch xarakteristikasi — <b>kuchlanganlik</b>: maydonning shu nuqtaga qoʻyilgan <b>sinov zaryadiga</b> (musbat, kichik) taʼsir kuchining shu zaryadga nisbati:</p>
<p style="font-size:20px;text-align:center"><b>E = F / q</b></p>
<p>Birligi: <b>N/C</b> (ya’ni V/m). Kuchlanganlik — vektor: yoʻnalishi musbat sinov zaryadga taʼsir etuvchi kuch yoʻnalishi bilan bir xil. Maydondagi zaryadga taʼsir kuchi: <b>F = q·E</b>.</p>
<h3>3. Nuqtaviy zaryad maydoni</h3><p>Q zaryaddan r masofadagi kuchlanganlik (vakuumda): <b>E = k·|Q| / r²</b>. Muhitda: E = k·|Q| / (ε·r²). Masofa 2 marta ortsa, E 4 marta kamayadi.</p>
<h3>4. Superpozitsiya prinsipi</h3><p>Bir nechta zaryad hosil qilgan maydon kuchlanganligi har bir zaryad maydoni kuchlanganliklarining <b>vektor yigʻindisiga</b> teng: <b>E = E₁ + E₂ + …</b></p>
<h3>5. Maydon chiziqlari (kuch chiziqlari)</h3><p>Maydonni koʻrgazmali tasvirlash uchun chiziqlar chiziladi. Xossalari:</p><ul><li>Musbat zaryaddan chiqadi, manfiy zaryadga kiradi (yoki cheksizlikka ketadi).</li><li>Chiziqning har nuqtasidagi urinma E yoʻnalishini beradi.</li><li>Chiziqlar kesishmaydi va uzilmaydi.</li><li>Chiziqlar zichroq joyda maydon kuchli.</li></ul>
<h3>6. Bir jinsli maydon</h3><p>Barcha nuqtalarida E bir xil (kattaligi va yoʻnalishi) boʻlgan maydon <b>bir jinsli</b> deyiladi. Uning chiziqlari parallel va bir xil masofada joylashadi. Qarama-qarshi zaryadlangan ikki parallel plastinka orasida (kondensatorda) bir jinsli maydon hosil boʻladi.</p>
<h3>7. Masala namunasi</h3><p>Q = 3 nC zaryaddan 3 sm masofada: E = 9·10⁹·3·10⁻⁹ / (0,03)² = 27 / 9·10⁻⁴ = <b>3·10⁴ N/C</b>. Bu nuqtadagi 2 nC zaryadga taʼsir kuchi: F = qE = 2·10⁻⁹·3·10⁴ = <b>6·10⁻⁵ N</b>.</p>
<h3>📌 Eslab qoling</h3><ul><li>E = F/q, birligi N/C.</li><li>Nuqtaviy zaryad: E = kQ/r².</li><li>Maydonlar vektor qoʻshiladi.</li><li>Maydon chiziqlari + dan chiqadi, − ga kiradi.</li></ul>

theory:`<h3>1. Oʻtkazgichdagi erkin zaryadlar</h3><p>Metallarda <b>erkin elektronlar</b> bor: ular kristall panjara ichida erkin harakatlana oladi. Shuning uchun metall oʻtkazgich elektr maydonga qoʻyilganda erkin zaryadlar qayta taqsimlanadi.</p>
<h3>2. Elektrostatik induksiya (influensiya)</h3><p>Oʻtkazgich tashqi elektr maydonga kiritilsa, uning bir uchida manfiy, qarama-qarshi uchida musbat zaryadlar paydo boʻladi. Bu <b>elektrostatik induksiya</b>. Shu sababli neytral jism zaryadlangan jismga tortiladi.</p>
<h3>3. Muvozanat sharti</h3><p>Zaryadlar harakati toʻxtaganda (muvozanat): oʻtkazgich <b>ichida E = 0</b>; sirtiga maydon <b>perpendikulyar</b> yoʻnalgan; butun oʻtkazgich <b>bir xil potensialda</b>. Aks holda zaryadlar harakatni davom ettirardi.</p>
<h3>4. Ortiqcha zaryad faqat sirtda</h3><p>Zaryadlangan oʻtkazgichda ortiqcha zaryad faqat <b>tashqi sirtda</b> joylashadi, bunga bir xil zaryadlarning bir-birini itarishi sabab. Ichi boʻsh (kovak) oʻtkazgichning ichki sirtida zaryad boʻlmaydi.</p>
<h3>5. Sirt boʻylab taqsimot</h3><p>Zaryad sirtda notekis taqsimlanadi: <b>egrilik radiusi kichik</b> (uchli) joylarda zichlik katta, yassi joylarda kichik. Sharda esa tekis.</p>
<h3>6. Uchli jismlarning amaliyoti</h3><ul><li><b>Zaryad „sizishi“:</b> uchda maydon juda kuchli boʻlib, havo ionlashadi va zaryad „elektr shamoli“ koʻrinishida ketadi.</li><li><b>Chaqmonqaytargich (Franklin, 1752):</b> uchli sterjen bino ustiga oʻrnatilib, yerga ulanadi va chaqmonni oʻziga tortib, zaryadni yerga oʻtkazadi.</li><li>Yuqori kuchlanishli qurilmalarda detallar yumaloq shaklda qilinadi — zaryad sizmasligi uchun.</li></ul>
<h3>7. Elektrostatik himoya</h3><p>Ichi boʻsh yopiq metall qobiq (yoki toʻr) ichida tashqi maydon boʻlmaydi — <b>Faradey qafasi</b>. Shu sababli samolyot, mashina kuzovi, ekranlangan kabel ichidagilar chaqmondan va elektr xalaqitdan himoyalanadi.</p>
<h3>8. Dielektriklarda qutblanish</h3><p>Dielektrikda erkin zaryadlar yoʻq. Elektr maydonda uning molekulalari <b>qutblanadi</b> (musbat va manfiy zaryadlar markazlari bir oz siljiydi), natijada dielektrik ichida maydon ε marta kuchsizlanadi.</p>
<h3>📌 Eslab qoling</h3><ul><li>Oʻtkazgich ichida E = 0.</li><li>Ortiqcha zaryad sirtda joylashadi.</li><li>Uchida zaryad zichligi katta.</li><li>Faradey qafasi ichkarini himoya qiladi.</li></ul>

theory:`<h3>1. Atmosfera elektri</h3><p>Yer manfiy zaryadlangan, atmosferaning yuqori qatlamlari esa musbat zaryadli. Ochiq havoda Yer sirtida elektr maydon kuchlanganligi taxminan <b>100–130 V/m</b> ni, yer sirtiga yaqin vertikal yoʻnalishda tashkil etadi.</p>
<h3>2. Momaqaldiroq bulutlari</h3><p>Kuchli yuqoriga koʻtarilayotgan havo oqimida suv va muz zarralari ishqalanadi va elektrlanadi. Natijada bulutning yuqori qismi musbat, pastki qismi esa manfiy zaryadlanadi. Bulut bilan yer (yoki bulutlar orasida) potensiallar farqi yuz million voltlargacha yetadi.</p>
<h3>3. Chaqmon</h3><p><b>Chaqmon</b> — bulut va yer (yoki bulutlar) orasidagi katta uchqunli elektr razryadi.</p><ul><li>Tok kuchi 10–100 kA gacha, kuchlanish 10⁸–10⁹ V.</li><li>Kanal harorati ≈ 30 000 K (Quyosh sirtidan bir necha marta issiq).</li><li>Havo keskin qizib kengayadi — portlashga oʻxshash tovush: <b>momaqaldiroq</b>.</li></ul>
<h3>4. Chaqmongacha masofani aniqlash</h3><p>Yorugʻlik deyarli bir zumda yetib keladi, tovush esa ≈ 340 m/s tezlik bilan. Chaqmon va guldirak orasidagi vaqt t boʻlsa, masofa <b>s = 340·t</b>. Masalan, t = 6 s → s ≈ 2 km.</p>
<h3>5. Chaqmonqaytargich</h3><p>1752-yilda B. Franklin ixtiro qilgan. Bino ustiga uchli metall sterjen oʻrnatiladi, u yoʻgʻon sim bilan <b>yerga ulanadi</b>. Chaqmon zaryadi sterjen orqali yerga oqib ketadi, bino zarar koʻrmaydi.</p>
<h3>6. Xavfsizlik qoidalari</h3><ul><li>Momaqaldiroqda yolgʻiz daraxt ostida turmang.</li><li>Ochiq maydonda baland boʻlmang, mashina ichi nisbatan xavfsiz (Faradey qafasi).</li><li>Suvdan uzoqlashing, mobil telefon va metall buyumlardan ehtiyot boʻling.</li></ul>
<h3>7. Boshqa elektr hodisalar</h3><ul><li><b>Sent-Elm choʻgʻlari</b> — baland uchli jismlar uchidagi yorugʻ chaqnash (korona razryad).</li><li><b>Qutb yogʻdusi</b> — Quyoshdan kelgan zaryadli zarralarning atmosfera bilan taʼsiri.</li><li><b>Statik elektr:</b> yonilgʻi sisternalari yerga ulanadi, kiyim chirsillaydi.</li><li>Baʼzi hayvonlar (elektr skat, elektr ugʻori) elektr maydon hosil qiladi.</li></ul>
<h3>8. Elektrostatikaning foydali qoʻllanilishi</h3><ul><li>Elektrostatik changtutgichlar (zavod tutunini tozalash).</li><li>Fotokopiya (kseroks) va lazer printer.</li><li>Elektrostatik boʻyash.</li></ul>

theory:`<h3>1. Elektr tok nima?</h3><p><b>Elektr toki</b> — zaryadlangan zarralarning tartibli (yoʻnalgan) harakati. Zarralarning tartibsiz issiqlik harakati tok hosil qilmaydi; tok uchun harakat bir yoʻnalishda boʻlishi kerak.</p>
<h3>2. Tok mavjud boʻlish shartlari</h3><ul><li>Muhitda <b>erkin zaryadli zarralar</b> boʻlishi.</li><li>Zarralarni harakatlantiruvchi <b>elektr maydon</b> boʻlishi (manba hosil qiladi).</li></ul>
<h3>3. Tokni tashuvchi zarralar</h3><ul><li><b>Metallarda</b> — erkin elektronlar.</li><li><b>Elektrolit eritmalarida</b> — musbat va manfiy ionlar.</li><li><b>Gazlarda</b> — ionlar va elektronlar.</li><li><b>Yarimoʻtkazgichlarda</b> — elektronlar va „teshiklar“.</li></ul>
<h3>4. Tokning yoʻnalishi</h3><p>Tarixan tokning yoʻnalishi sifatida <b>musbat zaryadlarning harakat yoʻnalishi</b> qabul qilingan: tok manba tashqarisida <b>musbat qutbdan manfiy qutbga</b> oqadi. Metallarda esa elektronlar teskari yoʻnalishda — manfiy qutbdan musbat qutbga harakatlanadi.</p>
<h3>5. Tok tezligi haqida</h3><p>Elektronlarning tartibli harakati (dreyf) tezligi juda kichik — millimetr/soniya tartibida. Lekin zanjirga kalit ulanganda elektr maydon sim boʻylab yorugʻlik tezligiga yaqin (≈ 3·10⁸ m/s) tezlikda tarqaladi, shuning uchun lampochka deyarli bir zumda yonadi.</p>
<h3>6. Tokning taʼsirlari</h3><ul><li><b>Issiqlik:</b> oʻtkazgich qiziydi (isitgich, lampochka).</li><li><b>Kimyoviy:</b> elektrolitlarda moddalar ajraladi (elektroliz).</li><li><b>Magnit:</b> tok atrofida magnit maydon hosil boʻladi (elektromagnit).</li><li><b>Yorugʻlik:</b> gazlarda razryad, LED.</li><li><b>Mexanik:</b> tok magnit maydonda kuch bilan taʼsirlashadi (dvigatel).</li></ul>
<h3>7. Elektr zanjiri</h3><p><b>Elektr zanjiri</b> — tok manbai, isteʼmolchi, kalit va ulovchi simlardan iborat yopiq kontur. Tok faqat <b>yopiq zanjirda</b> mavjud boʻladi.</p>
<ul><li><b>Manba</b> — elektr maydon hosil qiladi (batareya, akkumulyator).</li><li><b>Isteʼmolchi</b> — elektr energiyani boshqa turga aylantiradi (lampa, dvigatel).</li><li><b>Kalit</b> — zanjirni ulaydi/uzadi.</li><li><b>Simlar</b> — elementlarni ulaydi.</li></ul>
<h3>8. Sxema</h3><p>Zanjirlar shartli belgilar bilan <b>elektr sxemada</b> tasvirlanadi: galvanik element, batareya, lampa, rezistor, kalit, ampermetr, voltmetr va boshqalar. Sxema zanjirni oson tushunish va yigʻishga yordam beradi.</p>
<h3>📌 Eslab qoling</h3><ul><li>Tok — zaryadlarning yoʻnalgan harakati.</li><li>Tok uchun erkin zaryadlar va elektr maydon zarur.</li><li>Tok yoʻnalishi: + dan − ga (shartli).</li><li>Tok faqat yopiq zanjirda.</li></ul>

theory:`<h3>1. Tok manbai nima?</h3><p><b>Tok manbai</b> — zanjirda elektr maydon hosil qilib, tokni uzoq vaqt saqlab turuvchi qurilma. Manbaning ichida <b>tashqi kuchlar</b> (kimyoviy, mexanik, issiqlik, yorugʻlik) zaryadlarni ajratadi: bir qutbda manfiy (−), ikkinchisida musbat (+) zaryad toʻplanadi.</p>
<h3>2. Galvanik element</h3><p>Birinchi element 1800-yilda italyan olimi <b>A. Volta</b> tomonidan yaratilgan (Volta ustuni). Bunga L. Galvani (1780-yillar, baqa mushagi tajribalari) tadqiqotlari turtki boʻlgan. Oddiy galvanik element: <b>rux (Zn)</b> va <b>mis (Cu)</b> elektrodlar kislota eritmasida. Rux elektronlarni yoʻqotib erishga intiladi, elektronlar mis tomonga oʻtadi: rux — manfiy qutb, mis — musbat qutb. Kimyoviy energiya elektr energiyaga aylanadi.</p>
<h3>3. Quruq element va batareya</h3><p>Quruq elementda rux stakan (−), uglerod sterjen (+) va koʻp qatlamli elektrolit boʻladi. Bir nechta element <b>ketma-ket</b> ulansa, <b>batareya</b> hosil boʻladi va kuchlanishlar qoʻshiladi (3 ta 1,5 V → 4,5 V). Galvanik elementlar odatda qayta zaryadlanmaydi.</p>
<h3>4. Akkumulyatorlar</h3><p><b>Akkumulyator</b> — qayta zaryadlanadigan manba. Qoʻrgʻoshin-kislotali akkumulyator elementi ≈ 2 V; avtomobildagi 12 V akkumulyator 6 ta elementdan iborat. Litiy-ion akkumulyator ≈ 3,7 V (telefon, noutbuk). Zaryadlashda elektr energiya kimyoviy energiyaga aylanadi, ishlatishda — teskarisi.</p>
<h3>5. Boshqa manbalar</h3><ul><li><b>Elektr generator</b> — mexanik energiya → elektr (GES, IES, shamol).</li><li><b>Fotoelement (quyosh batareyasi)</b> — yorugʻlik → elektr.</li><li><b>Termoelement</b> — issiqlik → elektr (termopara).</li><li><b>Pyezoelement</b> — mexanik siqilish → elektr (zajigalka).</li></ul>
<h3>6. Manba qutblari va belgilash</h3><p>Manbaning ikki qutbi bor: musbat (+) va manfiy (−). Sxemada galvanik element — uzun chiziq (+) va qisqa qalin chiziq (−) koʻrinishida; batareya — bir nechta shunday juft.</p>
<h3>7. Xavfsizlik va ekologiya</h3><ul><li>Batareyani qizdirmang, ochmang, qisqa tutashtirmang.</li><li>Ishlatilgan batareya va akkumulyatorlarni oddiy axlatga tashlamang — tarkibidagi ogʻir metallar tabiatni ifloslaydi; maxsus qabul punktlariga topshiring.</li></ul>
<h3>📌 Eslab qoling</h3><ul><li>Manba zaryadlarni ajratadi, maydon hosil qiladi.</li><li>Galvanik element: kimyoviy → elektr energiya.</li><li>Akkumulyator qayta zaryadlanadi.</li><li>Batareya — ketma-ket ulangan elementlar.</li></ul>
<h3>❓ Savollar</h3><ol><li>Tok manbai vazifasi nima?</li><li>Galvanik element qanday ishlaydi?</li><li>Akkumulyator galvanik elementdan nimasi bilan farq qiladi?</li><li>Qanday manba turlarini bilasiz?</li></ol>`,

{m:'rad',T:0,d:12,col:0xfacc15,x:"Elektr maydon zaryadni koʻchirganda ish bajaradi. Bu ishning zaryadga nisbati — elektr kuchlanish: U = A/q."},
{m:'rad',T:0,d:12,col:0xfacc15,x:"Kuchlanish birligi — volt: 1 V = 1 J / 1 C. Zanjir uchlaridagi kuchlanish qancha katta boʻlsa, zaryadlar shuncha koʻp energiya oladi."},
{m:'cond',T:0,d:10,x:"Kuchlanish voltmetr bilan oʻlchanadi. Voltmetr isteʼmolchiga parallel ulanadi."}],
theory:`<h3>1. Elektr kuchlanish</h3><p>Elektr maydon zaryadni zanjirning bir nuqtasidan ikkinchisiga koʻchirganda ish bajaradi. <b>Elektr kuchlanish</b> — shu ishning koʻchirilgan zaryadga nisbatiga teng fizik kattalik:</p>
<p style="font-size:20px;text-align:center"><b>U = A / q</b></p>
<p>Bu yerda A — maydon bajargan ish (J), q — zaryad (C), U — kuchlanish (V). Undan: <b>A = U·q</b>, <b>q = A/U</b>.</p>
<h3>2. Birligi — volt</h3><p>Birlik italyan olimi A. Volta sharafiga <b>volt (V)</b> deb ataladi. <b>1 V = 1 J / 1 C</b>: zanjirning ikki nuqtasi orasidagi kuchlanish 1 V boʻlsa, 1 C zaryadni koʻchirishda maydon 1 J ish bajaradi.</p>
<ul><li>1 kV = 10³ V</li><li>1 mV = 10⁻³ V</li><li>1 µV = 10⁻⁶ V</li></ul>
<h3>3. Odatiy kuchlanishlar</h3><ul><li>Galvanik element — 1,5 V; „krona“ batareya — 9 V.</li><li>Avtomobil akkumulyatori — 12 V.</li><li>Uy elektr tarmogʻi — 220 V.</li><li>Yuqori kuchlanishli liniyalar — 110–500 kV.</li><li>Inson uchun nisbatan xavfsiz kuchlanish — ≈ 42 V dan past (nam joyda 12 V).</li></ul>
<h3>4. Voltmetr</h3><p><b>Voltmetr</b> — kuchlanishni oʻlchaydigan asbob. Sxemada doira ichida <b>V</b> harfi bilan belgilanadi. Qoidalar:</p>
<ul><li>Oʻlchanayotgan isteʼmolchiga <b>parallel</b> ulanadi.</li><li>Qarshiligi <b>juda katta</b> boʻladi — zanjir tokini deyarli oʻzgartirmaydi.</li><li>„+“ qisqichi manbaning musbat qutbiga qaragan tomonga ulanadi.</li><li>Asbobning oʻlchash chegarasidan oshirmaslik kerak.</li></ul>
<h3>5. Shkala boʻlinma qiymati</h3><p>Boʻlinma qiymati = (yaqin ikki raqamli belgi farqi) / (ular orasidagi boʻlinmalar soni). Masalan, 0 va 3 V orasida 10 boʻlinma boʻlsa — 0,3 V.</p>
<h3>6. Masalalar</h3><ul><li>A = 120 J, q = 20 C → U = 120/20 = <b>6 V</b>.</li><li>U = 220 V, q = 5 C → A = U·q = <b>1100 J</b>.</li><li>A = 60 J, U = 12 V → q = A/U = <b>5 C</b>.</li></ul>
<h3>📌 Eslab qoling</h3><ul><li>U = A/q, birligi volt.</li><li>1 V = 1 J/C.</li><li>Voltmetr parallel ulanadi.</li></ul>
<h3>❓ Savollar</h3><ol><li>Elektr kuchlanish nima?</li><li>1 V ning ma’nosi nima?</li><li>Voltmetr qanday ulanadi? Nega?</li><li>Zaryadni koʻchirishda 300 J ish bajarildi, q = 15 C. U = ? (20 V)</li></ol>`,
tests:["Kuchlanish formulasi?|U = A/q|U = A·q|U = q/A|U = F/q",

{m:'cond',T:0,d:10,x:"Tok kuchi ampermetr bilan oʻlchanadi va u zanjirga ketma-ket ulanadi."}],
theory:`<h3>1. Tok kuchi</h3><p><b>Tok kuchi</b> — oʻtkazgich koʻndalang kesimidan vaqt birligida oʻtgan zaryad miqdoriga teng fizik kattalik:</p>
<p style="font-size:20px;text-align:center"><b>I = q / t</b></p>
<p>Bu yerda q — zaryad (C), t — vaqt (s), I — tok kuchi (A). Undan: <b>q = I·t</b>, <b>t = q/I</b>.</p>
<h3>2. Birligi — amper</h3><p>Birlik fransuz fizigi A. Amper sharafiga nomlangan. <b>1 A = 1 C / 1 s</b>: kesimdan har soniyada 1 C zaryad oʻtsa, tok kuchi 1 A. 1 C zaryad ≈ 6,25·10¹⁸ ta elektronga mos.</p>
<ul><li>1 mA = 10⁻³ A</li><li>1 µA = 10⁻⁶ A</li><li>1 kA = 10³ A</li></ul>
<h3>3. Odatiy tok kuchlari</h3><ul><li>Qoʻl soati, kalkulyator — mikroamperlar.</li><li>Yorugʻlik diodi (LED) — 10–20 mA.</li><li>Choʻgʻlanma lampa — ≈ 0,3–0,5 A.</li><li>Dazmol, choynak — 5–10 A.</li><li>Chaqmon — 10–100 kA.</li></ul>
<h3>4. Ampermetr</h3><p><b>Ampermetr</b> — tok kuchini oʻlchaydigan asbob. Sxemada doira ichida <b>A</b> harfi bilan belgilanadi. Qoidalar:</p>
<ul><li>Zanjirga <b>ketma-ket</b> ulanadi.</li><li>Qarshiligi <b>juda kichik</b> — zanjir tokini oʻzgartirmaydi.</li><li>Hech qachon manbaga bevosita parallel ulanmaydi (qisqa tutashuv!).</li><li>„+“ qisqich manbaning „+“ qutbi tomoniga.</li></ul>
<h3>5. Tok kuchining xavfliligi</h3><p>Inson uchun 1 mA dan boshlab sezilarli, 10–15 mA — mushaklarni ushlab qoʻyadi, ≈ 100 mA dan yuqori tok oʻlimga olib kelishi mumkin. Xavfliligi tok kuchi va taʼsir vaqtiga bogʻliq.</p>
<h3>6. Masalalar</h3><ul><li>q = 30 C, t = 10 s → I = <b>3 A</b>.</li><li>I = 0,5 A, t = 2 min = 120 s → q = I·t = <b>60 C</b>.</li><li>q = 12 C, I = 4 A → t = q/I = <b>3 s</b>.</li><li>I = 2 A, t = 1 s → q = 2 C → n = q/e = 2/(1,6·10⁻¹⁹) ≈ <b>1,25·10¹⁹</b> ta elektron.</li></ul>
<h3>📌 Eslab qoling</h3><ul><li>I = q/t, birligi amper.</li><li>1 A = 1 C/s.</li><li>Ampermetr ketma-ket ulanadi.</li></ul>
<h3>❓ Savollar</h3><ol><li>Tok kuchi nima? Formulasi?</li><li>1 A ning ma’nosi nima?</li><li>Ampermetr qanday ulanadi? Nega?</li><li>Tok 0,2 A, vaqt 5 min. Zaryad? (60 C)</li></ol>`,

Object.assign(TOPICS[14],{csim:['wire','circuit','meter'],
scenes:[
{m:'rad',T:0,d:12,col:0x38bdf8,x:"Elektr qarshilik — o'tkazgichning tokka qarshilik ko'rsatish xossasi. U R harfi bilan belgilanadi."},
{m:'rad',T:0,d:12,col:0xfacc15,x:"Qarshilik birligi — om (Ω). 1 Ω = 1 V / 1 A. Om qonunidan: R = U / I."},
{m:'cond',T:0,d:10,x:"Qarshilik o'tkazgich materialiga, uzunligiga, kesim yuzasiga va haroratga bog'liq."}],
theory:`<h3>1. Elektr qarshilik</h3><p><b>Elektr qarshilik</b> — o'tkazgichning elektr tokiga ko'rsatadigan qarshilik xossasi. U <b>R</b> harfi bilan belgilanadi.</p>
<h3>2. Birligi — om</h3><p>Birlik nemis olimi G. Om sharafiga <b>om (Ω)</b> deb ataladi. <b>1 Ω = 1 V / 1 A</b>: o'tkazgich uchlarida 1 V kuchlanishda 1 A tok o'tsa, uning qarshiligi 1 Ω.</p>
<ul><li>1 kΩ = 10³ Ω</li><li>1 MΩ = 10⁶ Ω</li><li>1 mΩ = 10⁻³ Ω</li></ul>
<h3>3. Om qonunidan qarshilik</h3><p><b>R = U / I</b>. Bu formula orqali qarshilikni o'lchash mumkin.</p>
<h3>4. Qarshilikka ta'sir etuvchi omillar</h3><ul><li><b>Material</b> (solishtirma qarshilik ρ)</li><li><b>Uzunlik</b> l — uzunroq o'tkazgich qarshiligi katta</li><li><b>Kesim yuzasi</b> S — qalinroq o'tkazgich qarshiligi kichik</li><li><b>Harorat</b> — metallarda harorat oshsa R ortadi</li></ul>
<p>Formula: <b>R = ρ · l / S</b></p>
<h3>5. Solishtirma qarshilik</h3><p>ρ — materialning 1 m uzunlikdagi, 1 mm² kesimli o'tkazgichining qarshiligi. Mis: ρ ≈ 0,017 Ω·mm²/m, alyuminiy ≈ 0,028, temir ≈ 0,1, nixrom ≈ 1,1.</p>
<h3>6. Super o'tkazuvchanlik</h3><p>Ba'zi materiallar juda past haroratda qarshilikni deyarli nolga tushiradi (super o'tkazuvchanlik).</p>

function csims(b,keys){let h='';keys.forEach((k,j)=>{const S=SIMS[k];h+=`<h3>${j+1}) ${S.t}</h3><div class="sim" id="sm${j}"></div>`+S.c.map(c=>`<div>${c[1]}: <b id="v${j}${c[0]}">${c[4]}</b><input type="range" id="c${j}${c[0]}" min="${c[2]}" max="${c[3]}" value="${c[4]}" step="${c[5]}"></div>`).join('')+`<p id="in${j}"></p>`});
b.innerHTML=h+'<p><small>Sahnani sichqoncha yoki barmoq bilan surib aylantiring, slayderlar bilan qiymatlarni oʻzingiz oʻzgartiring.</small></p>';
const M=keys.map((k,j)=>{const m=mk($('#sm'+j));return{m,u:SIMS[k].init(m),S:SIMS[k],j}});cleanup=()=>M.forEach(o=>o.m.rd.dispose());let t=0;
(function loop(){raf=requestAnimationFrame(loop);t+=.016;M.forEach(o=>{const v={};o.S.c.forEach(c=>{v[c[0]]=+$('#c'+o.j+c[0]).value;$('#v'+o.j+c[0]).textContent=v[c[0]]});$('#in'+o.j).textContent=o.u(v,t);o.m.render()})})()}
/* ---- 3D simulyatsiyalar ---- */
function sims(b,t){if(t.csim)return csims(b,t.csim);b.innerHTML=`<h3>1) Gaz molekulalari (3D)</h3><div class="sim" id="s1"></div>Harorat: <input type="range" id="r1" min="5" max="100" value="40">
<h3>2) Agregat holatlar (3D)</h3><div class="sim" id="s2"></div>Harorat: <input type="range" id="r2" min="5" max="100" value="20"><span id="st"></span><p><small>Sichqoncha/barmoq bilan aylantirish shart emas — kamera o'zi aylanadi.</small></p>`;
const run=[sim($('#s1'),$('#r1'),'gas'),sim($('#s2'),$('#r2'),'state',$('#st'))];
function loop(){run.forEach(f=>f());raf=requestAnimationFrame(loop)}loop()}
function sim(el,rng,mode,lab){const W=el.clientWidth,H=300,sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(50,W/H,.1,100);cam.position.set(0,0,9);
const rd=new THREE.WebGLRenderer({antialias:true});rd.setSize(W,H);el.appendChild(rd.domElement);cleanup=(c=>()=>{c();rd.dispose()})(cleanup);
sc.add(new THREE.AmbientLight(0xffffff,.6));const L=new THREE.PointLight(0xffffff,1);L.position.set(5,5,8);sc.add(L);
const S=3,box=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(2*S,2*S,2*S)),new THREE.LineBasicMaterial({color:0x60a5fa}));sc.add(box);
const g=new THREE.SphereGeometry(.22,12,12),P=[],N=64;
for(let i=0;i<N;i++){const m=new THREE.Mesh(g,new THREE.MeshPhongMaterial({color:0x38bdf8}));
const x=i%4,y=(i>>2)%4,z=i>>4,h=new THREE.Vector3((x-1.5)*1.1,(y-1.5)*1.1-1.4,(z-1.5)*1.1);
m.position.copy(h);P.push({m,h,v:new THREE.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5).normalize()});sc.add(m)}
let a=0;return()=>{const T=+rng.value,sp=T/700;a+=.004;box.rotation.y=a;
let mode2=mode=='gas'?2:(T<35?0:T<70?1:2);if(lab)lab.textContent=' — '+['Qattiq','Suyuq','Gaz'][mode2];
P.forEach(p=>{const m=p.m;
if(mode2==0){m.position.set(p.h.x+Math.sin(a*60+p.h.y*9)*T/300,p.h.y+Math.cos(a*55+p.h.x*9)*T/300,p.h.z+Math.sin(a*50)*T/300)}
else{m.position.addScaledVector(p.v,sp*(mode2==1?.6:1.4)*3);
['x','y','z'].forEach(k=>{if(Math.abs(m.position[k])>S-.25){p.v[k]*=-1;m.position[k]=Math.sign(m.position[k])*(S-.25)}});
if(mode2==1){if(m.position.y>-.5){p.v.y=-Math.abs(p.v.y)}p.v.y-=.002}}
m.material.color.setHSL(.6-T/260,.9,.55)});
cam.position.set(Math.sin(a/2)*9,2,Math.cos(a/2)*9);cam.lookAt(0,0,0);rd.render(sc,cam)}}
/* ---- O'yinlar ---- */
function games(b,t){b.innerHTML=`<h3>🎮 1) To'g'ri / Noto'g'ri (tezkor)</h3><div id="g1"></div><h3>🎯 2) Zarralarni tut (20 s)</h3><div id="field"></div><p>Ball: <b id="sc">0</b> <button onclick="catchGame()">Boshlash</button></p>`;tfGame(t.tf)}
function tfGame(q){let i=0,s=0;const d=$('#g1');q=[...q].sort(()=>Math.random()-.5);
(function show(){if(i>=q.length){d.innerHTML=`<p>Natija: <b>${s}/${q.length}</b></p><button onclick="tab(${TOPICS.findIndex(t=>t.tf==window._q)},3)">Qayta</button>`;return}
d.innerHTML=`<p><b>${q[i][0]}</b></p><button onclick="ans(1)">✅ To'g'ri</button><button onclick="ans(0)">❌ Noto'g'ri</button>`;
window.ans=v=>{if(v==q[i][1])s++;i++;show()}})();window._q=q}
function catchGame(){const f=$('#field');f.innerHTML='';let s=0,t=20;$('#sc').textContent=0;
const dots=[];for(let i=0;i<6;i++){const e=document.createElement('div');e.className='dot';e.vx=(Math.random()-.5)*5;e.vy=(Math.random()-.5)*5;e.x=Math.random()*200;e.y=Math.random()*200;
e.onclick=()=>{s++;$('#sc').textContent=s;e.x=Math.random()*200;e.y=Math.random()*200};f.appendChild(e);dots.push(e)}
const iv=setInterval(()=>{dots.forEach(e=>{e.x+=e.vx;e.y+=e.vy;if(e.x<0||e.x>f.clientWidth-36)e.vx*=-1;if(e.y<0||e.y>244)e.vy*=-1;e.style.left=e.x+'px';e.style.top=e.y+'px'})},16);
const tm=setTimeout(()=>{clearInterval(iv);f.innerHTML='<p style="color:#fff;padding:20px">Vaqt tugadi! Ball: '+s+'</p>'},20000);cleanup=()=>{clearInterval(iv);clearTimeout(tm)}}
/* ---- Test, BSB, CHSB ---- */
function quiz(b,Q,name){let i=0,s=0;(function show(){if(i>=Q.length){b.innerHTML=`<h3>${name} natijasi: ${s}/${Q.length} (${Math.round(s/Q.length*100)}%)</h3><button onclick="home()">Mundarija</button>`;return}
const q=Q[i];b.innerHTML=`<p>${i+1}/${Q.length}</p><h3>${q[0]}</h3>`+q[1].map((o,k)=>`<button class="o" onclick="pick(${k})">${o}</button>`).join('')+'<div id="fb"></div>';
window.pick=k=>{document.querySelectorAll('.o').forEach((x,j)=>{x.disabled=true;if(j==q[2])x.classList.add('ok');else if(j==k)x.classList.add('no')});if(k==q[2])s++;setTimeout(()=>{i++;show()},900)}})()}
function bsb(ci,name){stop();let pool=[];TOPICS.forEach(t=>{if(t.tests&&(ci<0||t.ch==ci))pool.push(...t.tests)});
app.innerHTML=`<div class="card"><button onclick="openD()">☰ Mundarija</button><h2>${name}${ci>=0?' — '+CHAPTERS[ci]:''}</h2><div id="bq"></div></div>`;
if(!pool.length){$('#bq').textContent="Bu bo'lim uchun testlar hali qo'shilmagan.";return}
quiz($('#bq'),pool.sort(()=>Math.random()-.5).slice(0,name=='BSB'?10:20),name)}
home();
</script></body></html>
